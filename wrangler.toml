# Cloudflare Workers Static Assets (§34) — serves the static Astro build in dist/ (assets-only, no Worker script).
# Local: `npm run build && npm run cf:dev` (http://127.0.0.1:8787 — real 404 status and trailing-slash behaviour).
# Production: `npm run build && npx wrangler deploy` — from CI once the M2 Cloudflare credentials exist.
name = "ccso-portfolio"
compatibility_date = "2026-09-01"

# M2.5: production on <name>.<subdomain>.workers.dev — kept true through M3B / M3C as the rollback host while the
# Custom Domain below is validated; set to false only at M3D, once ccso.shsl.world is the CI-observed production
# endpoint (PRODUCTION_URL) and the only canonical host.
workers_dev = true
# Version / Preview URL routing on workers.dev (the subdomain's `previews_enabled` flag) is explicitly OFF:
# automated pull-request Previews are on hold since 2026-09-25 — a deleted Preview's alias kept routing
# (cloudflare/developer-platform#73). `wrangler deploy` pushes this key to the account whenever it is present
# (a `true` here would re-enable the routing) and leaves the setting untouched when it is omitted, so the explicit
# `false` makes every future deploy enforce the hold. Re-enabling Previews = this key back to true + the
# repository variable CLOUDFLARE_PREVIEW_ENABLED (docs/DECISIONS.md, "2026-09-25 — M2 Preview hold").
preview_urls = false

# Worker Previews (M2, Wrangler ≥ 4.135): the `previews` block is required even when empty — Previews do not
# inherit production settings, and static assets stay at the top level (uploaded with each Preview).
# A Preview can be created before the Worker's first production deploy. This block is Preview *configuration*
# (bindings / vars for `wrangler preview`); it does not enable Preview URL routing — that is `preview_urls` above.
previews = { }

[assets]
directory = "./dist"
# Unknown routes serve dist/404.html with a real 404 status — no SPA fallback to the homepage.
not_found_handling = "404-page"
# /about → /about/ (redirect), /about/ → dist/about/index.html, /about.html → /about — the default, made explicit
# because it is the production contract that astro `trailingSlash: 'always'` and the dist gate assume.
html_handling = "auto-trailing-slash"

# M3B — Custom Domain (shsl.world is an active Cloudflare zone; M3A preflight 2026-09-26: Path A, no nameserver
# migration, DNSSEC off, no CNAME on the hostname). The domain was attached once through the Cloudflare dashboard
# (bootstrap: Cloudflare created the proxied DNS record and the Advanced Certificate); from here this block is the
# durable source of truth — `wrangler deploy` asserts the attachment on every deploy. Exact hostname only (Custom
# Domains take no wildcards); pre-launch the pages stay `noindex, nofollow` until PUBLIC_SITE_INDEXABLE=true (M3C).
[[routes]]
pattern = "ccso.shsl.world"
custom_domain = true
