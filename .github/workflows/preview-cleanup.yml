name: preview-cleanup

# Deletes the Worker Preview `pr-<number>` when its pull request closes (merged or not).
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation
