name: preview-cleanup

# Deletes the Worker Preview `pr-<number>` when its pull request closes (merged or not).
# Gated by CLOUDFLARE_PREVIEW_ENABLED — the same variable as the `preview` job in ci.yml, independent of the
# production gate CLOUDFLARE_DEPLOY_ENABLED.
# Security assumption: `wrangler preview delete` removes the named Preview (its `<name>-<worker>` URL stops
# resolving), but the immutable Deployment URLs it produced are NOT assumed to be revoked — one was still serving
# minutes after the 2026-09-25 controlled deletion. Previews therefore never carry unpublished material, and
# Cloudflare Access ("Previews only" on the Worker) is the access control, not this cleanup.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation
