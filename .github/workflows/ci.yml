name: ci

# Production pipeline. `verify` and `e2e` are the required checks: type-check, build, verify dist/ against the
# route-state policy (scripts/verify-dist.mjs), then the Playwright smoke against `wrangler dev`.
# `preview` (same-repository PRs) and `deploy` (main) ship the exact dist/ that passed `verify`. They are gated by
# two independent repository variables so that enabling pull-request Previews can never production-deploy:
#   CLOUDFLARE_PREVIEW_ENABLED = "true"  → `preview` here + preview-cleanup.yml            (M2)
#   CLOUDFLARE_DEPLOY_ENABLED  = "true"  → `deploy` (production, push to main)             (M2.5)
# Both also need the secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (a token scoped to the Worker, Editor role).
# `preview` additionally needs the repository variable CLOUDFLARE_WORKERS_SUBDOMAIN (the account's workers.dev
# subdomain — configuration, not a secret) and, once Previews sit behind Cloudflare Access, the service-token
# secrets CF_ACCESS_CLIENT_ID + CF_ACCESS_CLIENT_SECRET for the Preview smoke.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pre-launch default: every page noindex, sitemap built but not advertised.
  # M3 (Public MVP): set the repository variable PUBLIC_SITE_INDEXABLE=true.
  PUBLIC_SITE_INDEXABLE: ${{ vars.PUBLIC_SITE_INDEXABLE || 'false' }}
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:site
      # Unit tests of the Preview automation scripts (URL parser, Preview smoke): tests/tools.
      - run: npm run test:tools
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  e2e:
    name: e2e
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: npx playwright install --with-deps chromium
      # Runs against `wrangler dev` (local, no account or secrets needed), so the 404 status and
      # trailing-slash behaviour under test are the real static-asset semantics.
      - run: npm run test:e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report
          retention-days: 7

  # M2 — one Worker Preview per same-repository pull request (Workers Previews, Wrangler ≥ 4.135):
  # `pr-<number>`, updated on every push, deleted by preview-cleanup.yml when the PR closes.
  # Fork PRs never reach this job: GitHub withholds secrets from them and the guard below excludes them.
  # Preview URLs are public by default (noindex meta + Cloudflare Access "Previews only" are the controls), and an
  # immutable Deployment URL may stay reachable after its Preview is deleted — never preview unpublished material.
  preview:
    name: preview (pr-${{ github.event.pull_request.number }})
    needs: verify
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-${{ github.sha }}
          path: dist
      # Wrangler prints the asset-upload progress to stdout before the `--json` document, so the URL is extracted by
      # scripts/extract-wrangler-preview-url.mjs (fail closed: no URL → this step fails, nothing is posted) and is
      # accepted only if its hostname is exactly pr-<PR>-ccso-portfolio.<CLOUDFLARE_WORKERS_SUBDOMAIN>.workers.dev
      # (`ccso-portfolio` = `name` in wrangler.toml), so the Access service token sent by the smoke below can never
      # travel to another host. The raw output is deliberately not echoed — it carries the deploying account's
      # e-mail and this log is public.
      - name: Create or update the Worker Preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
          WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          test -n "$WORKERS_SUBDOMAIN" || { echo "::error::repository variable CLOUDFLARE_WORKERS_SUBDOMAIN is not set"; exit 1; }
          out="$(npx wrangler preview --name "pr-$PR" --json)"
          url="$(printf '%s' "$out" | node scripts/extract-wrangler-preview-url.mjs --expect-hostname "pr-$PR-ccso-portfolio.$WORKERS_SUBDOMAIN.workers.dev")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Contract checks against the live Preview: 200s, real 404 for any unknown route, the custom 404 page on a
      # browser navigation (Sec-Fetch-Mode: navigate — the edge serves dist/404.html only to navigation requests),
      # canonical on ccso.shsl.world, robots meta matching PUBLIC_SITE_INDEXABLE. Runs BEFORE the comment: a Preview
      # that fails its contract stays up for debugging (preview-cleanup.yml removes it when the PR closes) but is
      # never announced as usable. CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET (optional repository secrets): the
      # Access service token once Previews sit behind Access — both set → sent with every request; neither → plain
      # requests; exactly one → the script refuses to run.
      - name: Preview smoke
        env:
          BASE: ${{ steps.preview.outputs.url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bash scripts/smoke-preview.sh "$BASE"
      - name: Post the Preview URL on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BODY: "Preview `pr-${{ github.event.pull_request.number }}`: ${{ steps.preview.outputs.url }} (built from ${{ github.event.pull_request.head.sha }}; the dist that passed `verify` and the Preview smoke; noindex)"
        run: gh pr comment "$PR" --edit-last --body "$BODY" || gh pr comment "$PR" --body "$BODY"

  # M2.5 / M3 — production deploy of the verified artifact on every push to main.
  deploy:
    name: deploy (production)
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-${{ github.sha }}
          path: dist
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "${{ github.sha }}"
      # Production smoke against the live host (repository variable PRODUCTION_URL: the workers.dev URL at M2.5,
      # https://ccso.shsl.world at M3). Fails the job — and therefore alerts — if the contract regresses.
      - name: Production smoke
        if: vars.PRODUCTION_URL != ''
        env:
          BASE: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          code() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          test "$(code "$BASE/")" = "200"
          test "$(code "$BASE/this-route-does-not-exist/")" = "404"
          test "$(code "$BASE/robots.txt")" = "200"
          test "$(code "$BASE/sitemap-index.xml")" = "200"
          test "$(curl -s -o /dev/null -w '%{redirect_url}' "$BASE/case-studies")" = "$BASE/case-studies/"
          curl -s "$BASE/" | grep -q '<link rel="canonical" href="https://ccso.shsl.world/"'
